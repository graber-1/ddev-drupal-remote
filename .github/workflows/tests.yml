name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x commands/host/.drupal-remote.sh commands/host/bulk-update commands/host/deploy commands/host/env commands/host/get-files commands/host/push-db commands/host/sync-from-remote tests/run.sh
      - name: tests
        run: tests/run.sh
